<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grist Map (OSM)</title>

  <!-- Grist Custom Widget API -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #wrap { height: 100%; display: flex; flex-direction: column; }
    #status { padding: 8px 10px; font: 13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #map { flex: 1; min-height: 300px; }
    .muted { color: #666; }
    .err { color: #a00; }
    .marker-label {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(70, 70, 70, 0.35);
      border-radius: 3px;
      box-shadow: none;
      color: #1f1f1f;
      font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 2px 4px;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="status" class="muted">En attente des données Grist…</div>
    <div id="map"></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');

    function setStatus(msg, cls) {
      statusEl.className = cls || 'muted';
      statusEl.textContent = msg;
    }

    // Init map
    const map = L.map('map', { zoomControl: true });

    // OSM tiles (standard)
    const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });
    tiles.addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
    const DEFAULT_CIRCLE_RADIUS = 8;
    const MAX_CIRCLE_RADIUS = 28;
    const DEFAULT_STROKE_COLOR = '#1f5eb8';
    const DEFAULT_FILL_COLOR = '#2a7fff';
    const CHOICE_PALETTE = [
      '#2a7fff', '#ff7f2a', '#7f3fbf', '#14a085', '#d35400',
      '#c0392b', '#1f8a4c', '#6c5ce7', '#8e44ad', '#16a085'
    ];

    // Default view (France)
    map.setView([46.5, 2.5], 6);

    function toNumber(v) {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function clearMarkers() {
      markersLayer.clearLayers();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function buildCircleRadius(rawSize, capSize) {
      if (rawSize === null) return null;
      const safeCap = (capSize !== null && capSize > 0) ? capSize : null;
      if (safeCap === null) return DEFAULT_CIRCLE_RADIUS;

      const normalized = clamp(rawSize, 0, safeCap) / safeCap;
      return DEFAULT_CIRCLE_RADIUS + (MAX_CIRCLE_RADIUS - DEFAULT_CIRCLE_RADIUS) * normalized;
    }

    function normalizeColorValue(raw) {
      if (raw === null || raw === undefined || raw === '') return null;
      if (typeof raw === 'boolean') return raw ? 'true' : 'false';
      if (Array.isArray(raw)) {
        const clean = raw.map((v) => String(v).trim()).filter(Boolean);
        return clean.length ? clean.join(' | ') : null;
      }
      return String(raw).trim() || null;
    }

    function hashString(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) {
        h = ((h << 5) - h) + s.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h);
    }

    function buildMarkerStyle(colorValue) {
      if (!colorValue) {
        return { stroke: DEFAULT_STROKE_COLOR, fill: DEFAULT_FILL_COLOR };
      }
      if (colorValue === 'true') {
        return { stroke: '#237a42', fill: '#2fb362' };
      }
      if (colorValue === 'false') {
        return { stroke: '#8d2d2d', fill: '#d24a4a' };
      }

      const idx = hashString(colorValue) % CHOICE_PALETTE.length;
      const fill = CHOICE_PALETTE[idx];
      return { stroke: fill, fill };
    }

    function collectExtraLabels(mappedRecord) {
      const values = [
        mappedRecord.Label,
        mappedRecord.Label2,
        mappedRecord.Label3,
        mappedRecord.Label4
      ];
      return values
        .map((v) => (v === null || v === undefined ? '' : String(v).trim()))
        .filter(Boolean);
    }

    function renderMarkers(records) {
      clearMarkers();

      const points = [];

      for (const record of records || []) {
        // record here is already a plain object like {A:..., B:...}
        // Apply Grist column mapping (important if user renames columns)
        const r = grist.mapColumnNames(record);
        if (!r) continue;

        const lat = toNumber(r.Latitude);
        const lon = toNumber(r.Longitude);

        if (lat === null || lon === null) continue;

        const rawSize = toNumber(r.MarkerSize || r.TailleMarqueur || r.Size || r.Value || r.Valeur);
        const rawCap = toNumber(r.MarkerSizeCap || r.TailleMax || r.MaxSize || r.Maximum);
        const labels = collectExtraLabels(r);
        const colorValue = normalizeColorValue(r.ColorBy || r.MarkerColorBy || r.Categorie || r.Category || r.Statut || r.Status || r.Etat || r.Active);
        const rowId = record.id ?? record.ID ?? record.Id;

        points.push({ lat, lon, rawSize, rawCap, labels, colorValue, rowId });
      }

      if (points.length === 0) {
        setStatus("Aucun point affichable (Latitude/Longitude manquantes ou non numériques).", "err");
        return;
      }

      const fallbackCap = points.reduce((max, p) => {
        if (p.rawSize === null || p.rawSize <= 0) return max;
        return Math.max(max, p.rawSize);
      }, 0) || null;

      const bounds = [];
      let count = 0;

      for (const point of points) {
        const capToUse = (point.rawCap !== null && point.rawCap > 0) ? point.rawCap : fallbackCap;
        const circleRadius = buildCircleRadius(point.rawSize, capToUse);
        const markerStyle = buildMarkerStyle(point.colorValue);
        const useCircleMarker = circleRadius !== null || point.colorValue !== null;

        const marker = useCircleMarker
          ? L.circleMarker([point.lat, point.lon], {
              radius: circleRadius ?? DEFAULT_CIRCLE_RADIUS,
              weight: 1,
              color: markerStyle.stroke,
              fillColor: markerStyle.fill,
              fillOpacity: 0.6
            })
          : L.marker([point.lat, point.lon]);

        const sizeLine = (point.rawSize !== null)
          ? `<div class="muted">Valeur taille: ${escapeHtml(String(point.rawSize))}${capToUse ? ` (plafond: ${escapeHtml(String(capToUse))})` : ''}</div>`
          : '';
        const colorLine = point.colorValue
          ? `<div class="muted">Couleur par: ${escapeHtml(point.colorValue)}</div>`
          : '';
        const labelLines = point.labels
          .map((lbl) => `<div>${escapeHtml(lbl)}</div>`)
          .join('');

        const popup = `
          <div style="font:13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
            ${labelLines || '<div class="muted">(Sans étiquette)</div>'}
            ${(point.rowId !== undefined) ? `<div class="muted">Row ID: ${escapeHtml(String(point.rowId))}</div>` : ''}
            <div class="muted">${point.lat.toFixed(6)}, ${point.lon.toFixed(6)}</div>
            ${sizeLine}
            ${colorLine}
          </div>
        `;

        marker.bindPopup(popup);
        if (point.labels.length > 0) {
          marker.bindTooltip(escapeHtml(point.labels.join(' | ')), {
            permanent: true,
            direction: 'top',
            className: 'marker-label',
            offset: [0, -8]
          });
        }

        marker.addTo(markersLayer);
        bounds.push([point.lat, point.lon]);
        count++;
      }

      setStatus(`${count} point(s) affiché(s).`, "muted");

      if (bounds.length === 1) {
        map.setView(bounds[0], 14);
      } else {
        map.fitBounds(bounds, { padding: [20, 20] });
      }
    }

    // Minimal HTML escaping for popup
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[c]));
    }

    // Tell Grist what columns we want the user to map
    grist.ready({
      columns: [
        { name: "Latitude",  title: "Latitude",  type: "Numeric", optional: false },
        { name: "Longitude", title: "Longitude", type: "Numeric", optional: false },
        { name: "Label", title: "Étiquette 1 (optionnel)", type: "Text", optional: true },
        { name: "Label2", title: "Étiquette 2 (optionnel)", type: "Text", optional: true },
        { name: "Label3", title: "Étiquette 3 (optionnel)", type: "Text", optional: true },
        { name: "Label4", title: "Étiquette 4 (optionnel)", type: "Text", optional: true },
        { name: "MarkerSize", title: "Valeur taille marqueur (optionnel)", type: "Numeric", optional: true },
        { name: "MarkerSizeCap", title: "Plafond taille marqueur (optionnel)", type: "Numeric", optional: true },
        { name: "ColorBy", title: "Colonne pour colorer (choix/bool) (optionnel)", type: "Text", optional: true }
      ]
    });

    // Render based on selected records (or whole table depending on widget linking)
    grist.onRecords((records) => {
      setStatus("Données reçues, rendu de la carte…", "muted");
      renderMarkers(records);
    });

    // If you prefer cursor-only behavior instead, you could use grist.onRecord.
  </script>
</body>
</html>
