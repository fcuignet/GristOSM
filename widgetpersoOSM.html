<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grist Map (OSM)</title>

  <!-- Grist Custom Widget API -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #wrap { height: 100%; display: flex; flex-direction: column; }
    #status { padding: 8px 10px; font: 13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #map { flex: 1; min-height: 300px; }
    .muted { color: #666; }
    .err { color: #a00; }
    #legend {
      display: none;
      padding: 8px 10px;
      font: 12px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      border-top: 1px solid #ddd;
      background: #fafafa;
    }
    #legend .legend-title { font-weight: 600; margin-bottom: 4px; }
    #legend .legend-item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    #legend .legend-swatch { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.35); }
    .marker-label {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(70, 70, 70, 0.35);
      border-radius: 3px;
      box-shadow: none;
      color: #1f1f1f;
      font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 2px 4px;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="status" class="muted">En attente des données Grist…</div>
    <div id="map"></div>
    <div id="legend"></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const legendEl = document.getElementById('legend');

    function setStatus(msg, cls) {
      statusEl.className = cls || 'muted';
      statusEl.textContent = msg;
    }

    const map = L.map('map', { zoomControl: true });

    const baseLayers = {
      "OSM Standard": L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }),
      "OSM HOT": L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap contributors, Tiles style by HOT'
      }),
      "Carto Light": L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      })
    };
    baseLayers["OSM Standard"].addTo(map);

    const DEFAULT_CIRCLE_RADIUS = 8;
    const MAX_CIRCLE_RADIUS = 28;
    const DEFAULT_STROKE_COLOR = '#1f5eb8';
    const DEFAULT_FILL_COLOR = '#2a7fff';
    const CHOICE_PALETTE = [
      '#2a7fff', '#ff7f2a', '#7f3fbf', '#14a085', '#d35400',
      '#c0392b', '#1f8a4c', '#6c5ce7', '#8e44ad', '#16a085'
    ];
    const PALETTES = {
      default: CHOICE_PALETTE,
      pastel: ['#8ecae6', '#ffb4a2', '#bde0fe', '#cdb4db', '#b7e4c7', '#ffd6a5', '#caffbf', '#a0c4ff'],
      vivid: ['#ff006e', '#3a86ff', '#8338ec', '#ffbe0b', '#fb5607', '#06d6a0', '#118ab2', '#ef476f'],
      earth: ['#588157', '#a3b18a', '#bc6c25', '#dda15e', '#6c584c', '#7f5539', '#8d6e63', '#9c6644'],
      grayscale: ['#111111', '#333333', '#555555', '#777777', '#999999', '#bbbbbb', '#dddddd']
    };

    let markerLayerControl = null;
    map.setView([46.5, 2.5], 6);

    function toNumber(v) {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function toDisplayValue(v) {
      if (v === null || v === undefined || v === '') return null;
      if (Array.isArray(v)) {
        const clean = v.map((item) => String(item).trim()).filter(Boolean);
        return clean.length ? clean.join(' | ') : null;
      }
      if (typeof v === 'object') {
        try {
          return JSON.stringify(v);
        } catch (e) {
          return String(v);
        }
      }
      const out = String(v).trim();
      return out || null;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function buildCircleRadius(rawSize, capSize) {
      if (rawSize === null) return null;
      const safeCap = (capSize !== null && capSize > 0) ? capSize : null;
      if (safeCap === null) return DEFAULT_CIRCLE_RADIUS;
      const normalized = clamp(rawSize, 0, safeCap) / safeCap;
      return DEFAULT_CIRCLE_RADIUS + (MAX_CIRCLE_RADIUS - DEFAULT_CIRCLE_RADIUS) * normalized;
    }

    function normalizeColorValue(raw) {
      if (typeof raw === 'boolean') return raw ? 'true' : 'false';
      return toDisplayValue(raw);
    }

    function hashString(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) {
        h = ((h << 5) - h) + s.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h);
    }

    function parseCustomPalette(raw) {
      const display = toDisplayValue(raw);
      if (!display) return null;
      const colors = display
        .split(/[|,;]/)
        .map((v) => v.trim())
        .filter((v) => /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v));
      return colors.length >= 2 ? colors : null;
    }

    function resolvePalette(rawPalette) {
      if (rawPalette === null || rawPalette === undefined || rawPalette === '') return CHOICE_PALETTE;
      const key = String(rawPalette).trim().toLowerCase();
      if (PALETTES[key]) return PALETTES[key];
      return parseCustomPalette(rawPalette) || CHOICE_PALETTE;
    }

    function buildMarkerStyle(colorValue, palette) {
      if (!colorValue) return { stroke: DEFAULT_STROKE_COLOR, fill: DEFAULT_FILL_COLOR };
      if (colorValue === 'true') return { stroke: '#237a42', fill: '#2fb362' };
      if (colorValue === 'false') return { stroke: '#8d2d2d', fill: '#d24a4a' };
      const safePalette = (palette && palette.length > 0) ? palette : CHOICE_PALETTE;
      const idx = hashString(colorValue) % safePalette.length;
      const fill = safePalette[idx];
      return { stroke: fill, fill };
    }

    function collectExtraLabels(mappedRecord) {
      return [mappedRecord.Label, mappedRecord.Label2, mappedRecord.Label3, mappedRecord.Label4]
        .map((v) => toDisplayValue(v))
        .filter(Boolean);
    }

    function renderLegend(colorEntries) {
      if (!colorEntries || colorEntries.length === 0) {
        legendEl.style.display = 'none';
        legendEl.innerHTML = '';
        return;
      }
      const items = colorEntries.map(({ value, fill }) => {
        const label = value === 'true' ? 'true (booléen)' : (value === 'false' ? 'false (booléen)' : value);
        return `<div class="legend-item"><span class="legend-swatch" style="background:${fill}"></span><span>${escapeHtml(label)}</span></div>`;
      }).join('');
      legendEl.innerHTML = `<div class="legend-title">Légende de colorisation</div>${items}`;
      legendEl.style.display = 'block';
    }

    function clearMarkerControl() {
      if (markerLayerControl) {
        markerLayerControl.remove();
        markerLayerControl = null;
      }
    }

    function renderMarkers(records) {
      clearMarkerControl();

      const points = [];
      let paletteInput = null;

      for (const record of records || []) {
        const r = grist.mapColumnNames(record);
        if (!r) continue;

        const lat = toNumber(r.Latitude);
        const lon = toNumber(r.Longitude);
        if (lat === null || lon === null) continue;

        const rawSize = toNumber(r.MarkerSize || r.TailleMarqueur || r.Size || r.Value || r.Valeur);
        const rawCap = toNumber(r.MarkerSizeCap || r.TailleMax || r.MaxSize || r.Maximum);
        const labels = collectExtraLabels(r);
        const colorValue = normalizeColorValue(r.ColorBy || r.MarkerColorBy || r.Categorie || r.Category || r.Statut || r.Status || r.Etat || r.Active);
        const layerName = toDisplayValue(r.Layer || r.Calque || r.Groupe || r.Group) || 'Calque principal';
        const paletteCandidate = r.ColorPalette || r.PaletteCouleurs || r.Palette || r.ColorScheme;
        if (paletteInput === null) {
          const parsed = toDisplayValue(paletteCandidate);
          if (parsed) paletteInput = parsed;
        }
        const rowId = record.id ?? record.ID ?? record.Id;

        points.push({ lat, lon, rawSize, rawCap, labels, colorValue, rowId, layerName });
      }

      if (points.length === 0) {
        renderLegend([]);
        setStatus("Aucun point affichable (Latitude/Longitude manquantes ou non numériques).", "err");
        return;
      }

      const fallbackCap = points.reduce((max, p) => (p.rawSize !== null && p.rawSize > 0 ? Math.max(max, p.rawSize) : max), 0) || null;
      const colorPalette = resolvePalette(paletteInput);

      const bounds = [];
      const legendMap = new Map();
      const overlayLayers = new Map();

      for (const point of points) {
        const capToUse = (point.rawCap !== null && point.rawCap > 0) ? point.rawCap : fallbackCap;
        const circleRadius = buildCircleRadius(point.rawSize, capToUse);
        const markerStyle = buildMarkerStyle(point.colorValue, colorPalette);
        if (point.colorValue) legendMap.set(point.colorValue, markerStyle.fill);

        const useCircleMarker = circleRadius !== null || point.colorValue !== null;
        const marker = useCircleMarker
          ? L.circleMarker([point.lat, point.lon], {
              radius: circleRadius ?? DEFAULT_CIRCLE_RADIUS,
              weight: 1,
              color: markerStyle.stroke,
              fillColor: markerStyle.fill,
              fillOpacity: 0.6
            })
          : L.marker([point.lat, point.lon]);

        const sizeLine = point.rawSize !== null
          ? `<div class="muted">Valeur taille: ${escapeHtml(String(point.rawSize))}${capToUse ? ` (plafond: ${escapeHtml(String(capToUse))})` : ''}</div>`
          : '';
        const colorLine = point.colorValue ? `<div class="muted">Couleur par: ${escapeHtml(point.colorValue)}</div>` : '';
        const layerLine = `<div class="muted">Calque: ${escapeHtml(point.layerName)}</div>`;
        const labelLines = point.labels.map((lbl) => `<div>${escapeHtml(lbl)}</div>`).join('');

        marker.bindPopup(`
          <div style="font:13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
            ${labelLines || '<div class="muted">(Sans étiquette)</div>'}
            ${(point.rowId !== undefined) ? `<div class="muted">Row ID: ${escapeHtml(String(point.rowId))}</div>` : ''}
            ${layerLine}
            <div class="muted">${point.lat.toFixed(6)}, ${point.lon.toFixed(6)}</div>
            ${sizeLine}
            ${colorLine}
          </div>
        `);

        if (point.labels.length > 0) {
          marker.bindTooltip(escapeHtml(point.labels.join(' | ')), {
            permanent: true,
            direction: 'top',
            className: 'marker-label',
            offset: [0, -8]
          });
        }

        if (!overlayLayers.has(point.layerName)) {
          overlayLayers.set(point.layerName, L.layerGroup().addTo(map));
        }
        marker.addTo(overlayLayers.get(point.layerName));

        bounds.push([point.lat, point.lon]);
      }

      const overlayObject = Object.fromEntries(overlayLayers.entries());
      markerLayerControl = L.control.layers(baseLayers, overlayObject, { collapsed: false }).addTo(map);

      renderLegend(Array.from(legendMap, ([value, fill]) => ({ value, fill })));
      setStatus(`${points.length} point(s) affiché(s) sur ${overlayLayers.size} calque(s).`, "muted");

      if (bounds.length === 1) {
        map.setView(bounds[0], 14);
      } else {
        map.fitBounds(bounds, { padding: [20, 20] });
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[c]));
    }

    grist.ready({
      columns: [
        { name: "Latitude",  title: "Latitude",  type: "Numeric", optional: false },
        { name: "Longitude", title: "Longitude", type: "Numeric", optional: false },
        { name: "Label", title: "Nom (obligatoire)", type: "Text", optional: false },
        { name: "Label2", title: "Étiquette 2 (optionnel, tout type)", optional: true },
        { name: "Label3", title: "Étiquette 3 (optionnel, tout type)", optional: true },
        { name: "Label4", title: "Étiquette 4 (optionnel, tout type)", optional: true },
        { name: "Layer", title: "Calque / groupe (optionnel)", optional: true },
        { name: "MarkerSize", title: "Valeur taille marqueur (optionnel)", type: "Numeric", optional: true },
        { name: "MarkerSizeCap", title: "Plafond taille marqueur (optionnel)", type: "Numeric", optional: true },
        { name: "ColorBy", title: "Colonne pour colorer (optionnel, tout type)", optional: true },
        { name: "ColorPalette", title: "Palette couleurs (optionnel: default/pastel/vivid/earth/grayscale ou #hex,#hex...)", optional: true }
      ]
    });

    grist.onRecords((records) => {
      setStatus("Données reçues, rendu de la carte…", "muted");
      renderMarkers(records);
    });
  </script>
</body>
</html>
